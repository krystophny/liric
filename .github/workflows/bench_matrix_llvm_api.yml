name: Bench Matrix LLVM API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  LIRIC_LFORTRAN_REF: origin/liric-aot-minimal

jobs:
  bench-matrix-llvm-api:
    name: bench_matrix (mode=llvm api lanes)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2.0.6
        with:
          micromamba-version: "2.5.0-2"
          environment-file: tools/llvm_backend_environment.yml
          create-args: >-
            llvmdev=20
          cache-environment: true
          cache-environment-key: bench-matrix-llvm-api-llvm20

      - name: Configure and build
        shell: bash -e -l {0}
        run: |
          llvm_config="$(command -v llvm-config || command -v llvm-config-20 || true)"
          if [[ -z "${llvm_config}" ]]; then
            echo "llvm-config not found" >&2
            exit 1
          fi
          cmake -S . -B build -G Ninja \
            -DWITH_REAL_LLVM_BACKEND=ON \
            -DLIRIC_LFORTRAN_LIRIC_LINK_REAL_LLVM=OFF \
            -DWITH_BENCH_TCC=OFF \
            -DWITH_BENCH_LLI_PHASES=OFF \
            -DLIRIC_LFORTRAN_REF="${LIRIC_LFORTRAN_REF}" \
            -DLIRIC_LLVM_CONFIG_EXE="${llvm_config}" || {
            echo 'PRODUCER_BUILD_FAIL: bench matrix producer configuration' >&2
            exit 1
          }
          echo "tested LFortran ref: ${LIRIC_LFORTRAN_REF}"
          grep -F -- "-DLIRIC_INCLUDE_DIR=" build/lfortran_baseline_configure_args.txt
          cmake --build build -j"$(nproc)" --target bench_matrix bench_compat_check bench_api liric_probe_runner lfortran_producer_ready || {
            echo 'PRODUCER_BUILD_FAIL: bench matrix producers' >&2
            exit 1
          }

      - name: Run bench_matrix llvm API lanes
        shell: bash -e -l {0}
        run: |
          ./build/liric_producer_manifest --check "${GITHUB_WORKSPACE}/build/producer/liric.manifest"
          rm -rf /var/tmp/liric_bench_llvm_api
          ./build/bench_matrix \
            --bench-dir /var/tmp/liric_bench_llvm_api \
            --modes llvm \
            --policies direct,ir \
            --lanes api_full_llvm,api_backend_llvm \
            --api-cases 10 \
            --require-cells 4 \
            --timeout 15 \
            --timeout-ms 15000 || {
              rc=$?
              if [[ -f /var/tmp/liric_bench_llvm_api/matrix_failures.jsonl ]]; then
                echo "matrix_failures.jsonl:"
                cat /var/tmp/liric_bench_llvm_api/matrix_failures.jsonl
              fi
              if [[ -f /var/tmp/liric_bench_llvm_api/matrix_summary.json ]]; then
                echo "matrix_summary.json:"
                cat /var/tmp/liric_bench_llvm_api/matrix_summary.json
              fi
              exit "${rc}"
            }

      - name: Assert summary
        shell: bash -e -l {0}
        run: |
          summary=/var/tmp/liric_bench_llvm_api/matrix_summary.json
          test -f "${summary}"
          jq -e '
            .status == "OK" and
            .cells_attempted == 4 and
            .cells_failed == 0 and
            .compat_ok == true
          ' "${summary}" >/dev/null
          if [[ -s /var/tmp/liric_bench_llvm_api/matrix_failures.jsonl ]]; then
            echo "matrix_failures.jsonl is not empty" >&2
            cat /var/tmp/liric_bench_llvm_api/matrix_failures.jsonl >&2
            exit 1
          fi

      - name: Upload producer manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-matrix-producer-linux-x86_64
          if-no-files-found: warn
          path: build/producer/*.manifest
